# Tooling config only - Remind Me is run from source (run.bat) or built with build.bat.

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E741"]  # short geometry names like l, t, r, b are used on purpose
